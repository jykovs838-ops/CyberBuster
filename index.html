<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Buster v9.0 | Quantum Firebase Edition</title>
    <style>
        /* --- QUANTUM DESIGN SYSTEM --- */
        body {
            background: radial-gradient(circle at center, #0a0a1a 0%, #05050a 100%);
            color: #00ffff; font-family: 'Consolas', 'Courier New', monospace; margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        .quantum-header {
            width: 100%; padding: 60px 0; text-align: center; border-bottom: 2px solid #ff1493;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.4); background: rgba(10, 10, 20, 0.8);
        }

        h1 { font-size: clamp(2em, 8vw, 4em); margin: 0; text-shadow: 0 0 20px #00ffff; letter-spacing: 8px; text-transform: uppercase; }
        .version-tag { background: #ff1493; color: white; padding: 4px 12px; border-radius: 4px; font-size: 0.4em; vertical-align: middle; }

        .container { max-width: 1000px; width: 90%; margin: 40px 0; }

        /* СОЦМЕРЕЖІ ТА СТАТУС */
        .social-row { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-bottom: 50px; }
        
        .card-link {
            display: flex; align-items: center; padding: 12px 20px; text-decoration: none;
            border-radius: 10px; font-weight: bold; font-size: 13px; text-transform: uppercase;
            transition: 0.3s; color: white !important; min-width: 220px; cursor: pointer;
        }

        .yt { background: #FF0000; box-shadow: 0 4px 15px rgba(255,0,0,0.3); border-bottom: 4px solid #b30000; }
        .tt { background: #010101; box-shadow: 3px 3px 0px #EE1D52, -3px -3px 0px #69C9D0; }
        .booster-status { background: #1a1a1a; border: 1px solid #333; border-bottom: 4px solid #444; position: relative; }
        .booster-status.active { border-bottom: 4px solid #00ff9d; box-shadow: 0 0 15px rgba(0, 255, 157, 0.2); }

        .pulse { width: 8px; height: 8px; border-radius: 50%; background: #555; margin-left: auto; position: relative; }
        .active .pulse { background: #00ff9d; }
        .active .pulse::after { content: ''; position: absolute; width: 100%; height: 100%; background: #00ff9d; border-radius: 50%; animation: p 1.5s infinite; }
        @keyframes p { 0% {transform: scale(1); opacity: 0.8;} 100% {transform: scale(3.5); opacity: 0;} }

        /* ВІДГУКИ */
        .rev-card { background: #0a0a15; border: 1px solid #333; border-left: 5px solid #ff1493; padding: 20px; margin-bottom: 15px; border-radius: 0 10px 10px 0; position: relative; }
        .rev-user { display: flex; align-items: center; color: #00ffff; font-weight: bold; margin-bottom: 10px; }
        .rev-user img { width: 30px; height: 30px; border-radius: 50%; margin-right: 12px; border: 1px solid #ff1493; }
        
        .admin-btns { margin-top: 10px; display: flex; gap: 10px; }
        .btn-del { background: #ff4d4d; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; font-size: 10px; font-family: monospace; }
        .btn-ban { background: #ffa500; color: black; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; font-size: 10px; font-family: monospace; }

        /* АДМІН-ПАНЕЛЬ СТАТУСУ */
        #status-admin-panel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: #111; padding: 30px; border: 2px solid #00ff9d; z-index: 10000; text-align: center; box-shadow: 0 0 50px #000; }
        .st-btn { padding: 10px 20px; margin: 10px; cursor: pointer; border: none; font-weight: bold; }

        textarea { width: 100%; height: 100px; background: #000; border: 1px solid #ff1493; color: #00ffff; padding: 15px; border-radius: 8px; font-family: 'Consolas'; box-sizing: border-box; }
        .btn-pub { background: #00ff00; color: #000; border: none; padding: 12px 30px; margin-top: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="quantum-header">
        <h1>CYBER BUSTER <span class="version-tag">V9.0</span></h1>
        <p style="color: #888; letter-spacing: 5px; margin-top: 10px;">FIREBASE QUANTUM CORE</p>
    </div>

    <div class="container">
        <!-- СОЦМЕРЕЖІ ТА СТАТУС -->
        <div class="social-row">
            <a href="https://www.youtube.com/@CyberCatUA" target="_blank" class="card-link yt">YouTube</a>
            <a href="https://www.tiktok.com/@cyber_cat_ua_dev" target="_blank" class="card-link tt">TikTok</a>
            <div id="status-card" class="card-link booster-status" onclick="secretAdmin()">
                <span>Project: <b id="st-label">Checking...</b></span>
                <div class="pulse"></div>
            </div>
        </div>

        <!-- ВІДГУКИ -->
        <div id="reviews-wrap">
            <h2 style="text-align: center; margin-bottom: 30px;">/// ЗВІТИ ОПЕРАТОРІВ ///</h2>
            
            <div id="auth-section" style="text-align: center; margin-bottom: 30px;">
                <button onclick="login()" style="background:none; border:1px solid #ff1493; color:#ff1493; padding:12px 30px; cursor:pointer; font-family:'Consolas';">УВІЙТИ ЧЕРЕЗ GOOGLE</button>
            </div>

            <div id="editor-section" style="display: none; margin-bottom: 40px; background:rgba(255,20,147,0.05); padding:20px; border-radius:10px;">
                <p>Оператор: <span id="user-display-name" style="color:#00ff00;"></span></p>
                <textarea id="rev-input" placeholder="Введіть дані звіту..."></textarea>
                <button class="btn-pub" onclick="saveReview()">ОПУБЛІКУВАТИ ЗВІТ</button>
            </div>

            <div id="reviews-list"></div>
        </div>
    </div>

    <!-- ПАНЕЛЬ КЕРУВАННЯ СТАТУСОМ (Тільки для тебе) -->
    <div id="status-admin-panel">
        <h3>Керування Booster</h3>
        <button class="st-btn" style="background:#00ff9d" onclick="updateStatus('on')">ПРАЦЮЮ</button>
        <button class="st-btn" style="background:#ff4d4d" onclick="updateStatus('off')">ПАУЗА</button>
        <br><button onclick="document.getElementById('status-admin-panel').style.display='none'" style="background:none; color:gray; border:none; margin-top:15px; cursor:pointer;">Закрити</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDtEGD1v5tjbTSABqLqX2whpSPlxp5zCfE",
            authDomain: "cyberbustersite.firebaseapp.com",
            projectId: "cyberbustersite",
            storageBucket: "cyberbustersite.firebasestorage.app",
            messagingSenderId: "1012161583279",
            appId: "1:1012161583279:web:5bf796c60c62239f7c1c5a"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const ADMIN_UID = "ZEnDPepEW9PcjUVfvgqjmr4USlb2";
        let isAdmin = false;

        // --- СТАТУС ПРОЕКТУ (ЧЕРЕЗ FIREBASE) ---
        let clicks = 0;
        function secretAdmin() {
            if(!isAdmin) return;
            clicks++;
            setTimeout(() => clicks = 0, 1000);
            if(clicks === 3) document.getElementById('status-admin-panel').style.display = 'block';
        }

        async function updateStatus(val) {
            await db.collection('settings').doc('booster').set({ status: val });
            document.getElementById('status-admin-panel').style.display = 'none';
        }

        db.collection('settings').doc('booster').onSnapshot(doc => {
            const data = doc.data();
            const card = document.getElementById('status-card');
            const label = document.getElementById('st-label');
            if(data && data.status === 'on') {
                card.classList.add('active'); label.innerText = "ПРАЦЮЮ";
            } else {
                card.classList.remove('active'); label.innerText = "ПАУЗА";
            }
        });

        // --- AUTH & REVIEWS ---
        function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }

        auth.onAuthStateChanged(async user => {
            if(user) {
                isAdmin = (user.uid === ADMIN_UID);
                const ban = await db.collection('banned').doc(user.uid).get();
                if(ban.exists) {
                    document.getElementById('reviews-wrap').innerHTML = "<h2 style='color:red; text-align:center;'>ДОСТУП ЗАБЛОКОВАНО</h2>";
                    return;
                }
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('editor-section').style.display = 'block';
                document.getElementById('user-display-name').innerText = user.displayName + (isAdmin ? " [ADMIN]" : "");
            }
        });

        async function saveReview() {
            const u = auth.currentUser;
            const t = document.getElementById('rev-input').value;
            if(!t.trim()) return;
            await db.collection('reviews').doc(u.uid).set({
                uid: u.uid, name: u.displayName, text: t, photo: u.photoURL, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("Звіт прийнято!");
        }

        async function delRev(id) { if(confirm("Видалити?")) await db.collection('reviews').doc(id).delete(); }
        async function banUsr(uid, name) {
            if(confirm("Забанити " + name + "?")) {
                await db.collection('banned').doc(uid).set({ name: name });
                await db.collection('reviews').doc(uid).delete();
            }
        }

        db.collection('reviews').orderBy('timestamp', 'desc').onSnapshot(snap => {
            const list = document.getElementById('reviews-list');
            list.innerHTML = "";
            const curr = auth.currentUser;
            snap.forEach(doc => {
                const r = doc.data();
                let btns = "";
                if(curr && (isAdmin || curr.uid === r.uid)) {
                    btns += `<button class="btn-del" onclick="delRev('${doc.id}')">ВИДАЛИТИ ${isAdmin && r.uid !== ADMIN_UID ? '(ADM)' : ''}</button>`;
                }
                if(isAdmin && r.uid !== ADMIN_UID) {
                    btns += `<button class="btn-ban" onclick="banUsr('${r.uid}', '${r.name}')">БАН</button>`;
                }
                list.innerHTML += `
                    <div class="rev-card">
                        <div class="rev-user"><img src="${r.photo}"> ${r.name}</div>
                        <p style="white-space:pre-wrap;">${r.text}</p>
                        <div class="admin-btns">${btns}</div>
                    </div>`;
            });
        });
    </script>
</body>
</html>
